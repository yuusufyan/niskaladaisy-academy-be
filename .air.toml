# Run via `docker compose up` (or WSL): Windows ASR policy blocks freshly built .exe files on this machine.
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main ./cmd/api"
  entrypoint = ["./tmp/main"]
  delay = 1000
  exclude_dir = ["tmp", "bin", "vendor", ".git"]
  exclude_regex = ["_test\\.go"]
  include_ext = ["go", "env"]
  include_file = [".env"]
  kill_delay = "2s"
  send_interrupt = true
  stop_on_error = true
  log = "build-errors.log"
  # File events from Windows don't reach WSL2 or bind-mounted containers, so poll instead.
  poll = true
  poll_interval = 1000

[log]
  time = true

[misc]
  # Deleting tmp on exit breaks any other air instance still using it.
  clean_on_exit = false

[screen]
  clear_on_rebuild = false
