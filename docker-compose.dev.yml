# Hot reload with air inside the container:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  niskaladaisy-academy-be:
    build:
      target: dev
    volumes:
      - .:/app
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build

volumes:
  go-mod:
  go-build:
